<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de tareas</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    <main>
        <h1>Mi gestor de tareas</h1>
        <p>Agrega y organiza tus tareas pendientes.</p>

        <form id="formulario">
            <label for="tarea">Nombre de la tarea:</label>
            <input type="text" id="tarea" maxlength="100" placeholder="Ej. Terminar tarea de JavaScript">
            <button type="submit" id="botonGuardar">Agregar tarea</button>
            <button type="button" id="botonCancelar" hidden>Cancelar edición</button>
        </form>

        <p id="mensaje" role="status" aria-live="polite"></p>

        <label for="buscar">Buscar tarea:</label>
        <input type="text" id="buscar" placeholder="Escribe para buscar...">

        <p id="contador">Total: 0 | Pendientes: 0 | Completadas: 0</p>

        <h2>Lista de tareas</h2>
        <ul id="lista"></ul>
        <p id="vacio">Todavía no hay tareas.</p>
    </main>
    <script src="script.js"></script>
</body>
</html>
